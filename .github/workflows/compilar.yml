name: Compilar APKs

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/wristmind.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/wristmind.keystore" >> "$GITHUB_ENV"
            echo "Assinatura: chave privada do projeto"
          else
            echo "Assinatura: chave de testes desta compilacao"
          fi

      - name: Compilar telemovel e relogio
        run: gradle :mobile:assembleRelease :wear:assembleRelease --no-daemon

      - name: Preparar ficheiros
        run: |
          mkdir -p saida
          cp mobile/build/outputs/apk/release/*.apk saida/WristMindTelemovel.apk
          cp wear/build/outputs/apk/release/*.apk saida/WristMindRelogio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WristMindAPKs
          path: saida/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: WristMind ultima versao
          files: saida/*.apk
          make_latest: true
