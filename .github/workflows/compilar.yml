name: Build APKs

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/orbi.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/orbi.keystore" >> "$GITHUB_ENV"
            echo "Signing with the project key"
          else
            echo "Signing with this build's test key"
          fi

      - name: Build phone and watch apps
        run: gradle :mobile:assembleRelease :wear:assembleRelease --no-daemon

      - name: Collect files
        run: |
          mkdir -p saida
          cp mobile/build/outputs/apk/release/*.apk saida/OrbiPhone.apk
          cp wear/build/outputs/apk/release/*.apk saida/OrbiWatch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OrbiAPKs
          path: saida/*.apk

      - name: Remove previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Orbi latest build
          files: saida/*.apk
          make_latest: true
